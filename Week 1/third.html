<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Example</title>
</head>
<body>
    <h3>Table 1: Table with colspan and rowspan</h3>
    <table border="1" width="300" style="border-collapse: collapse;">
    <tr>
        <td align="center" colspan="3">NAME</td>
    </tr>
    <tr>
        <td align="center" rowspan="3">AGE</td>
        <td align="center" colspan="2">EMAIL</td>
    </tr>
    <tr>
        <td height="20"></td>
        <td height="20"></td>
    </tr>
    <tr>
        <td height="20"></td>
        <td height="20"></td>
    </tr>
    </table>

    <p>
        <h3 align="center">Comparison of models</h3>
        <table border="1" width="500" style="border-collapse: collapse;">
            <tr>
                <td align="center">Model</td>
                <td align="center">OS</td>
                <td align="center">Display</td>
                <td align="center">RAM</td>
            </tr>
            <tr>
                <td align="center">Samsung Galaxy S7</td>
                <td align="center" rowspan="2">Android</td>
                <td align="center">5.1"</td>
                <td align="center">4 GB</td>
            </tr>
            <tr>
                <td align="center">Sony Xperia Z5</td>
                <td align="center">4.6"</td>
                <td align="center" rowspan="2">2 GB</td>
            </tr>
            <tr>
                <td align="center">Apple iPhone 6s</td>
                <td align="center">iOS</td>
                <td align="center">4.7"</td>
        </table>
    </p>
</body>
</html>
